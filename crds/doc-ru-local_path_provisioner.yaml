apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
spec:
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |
          StorageClass для томов в директории на локальных дисках узлов кластера.

          Модуль создаёт StorageClass с именем этого объекта.
        properties:
          spec:
            properties:
              nodeGroups:
                description: |
                  Группы узлов, на узлах которых могут размещаться тома StorageClass.

                  Если параметр не задан, StorageClass не ограничивает узлы.
              path:
                description: |
                  Директория на узлах, в которой создаются тома.

                  Абсолютный путь без кавычек, обратных слешей, пробельных и управляющих символов.
              reclaimPolicy:
                description: |
                  Что происходит с PersistentVolume и его директорией после удаления PersistentVolumeClaim.

                  - `Retain` — PersistentVolume остаётся в статусе `Released`, данные остаются в директории.
                  - `Delete` — модуль удаляет директорию с данными и PersistentVolume.

                  При изменении значения StorageClass пересоздаётся; существующие PersistentVolume сохраняют политику, с которой были созданы.
