apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
spec:
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |
          Параметры экземпляра `local-path-provisioner`.
        properties:
          spec:
            properties:
              nodeGroups:
                description: |
                  Группы узлов (NodeGroup), в которых работает данный StorageClass.
              path:
                description: |
                  Корневой путь на узле к каталогу для хранения PV.

                  Абсолютный путь без кавычек, обратных слешей, пробельных и управляющих символов.
              reclaimPolicy:
                description: |
                  Сохранять ли PV после удаления PVC.
