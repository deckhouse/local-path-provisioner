apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: localpathprovisioners.deckhouse.io
  labels:
    heritage: deckhouse
    module: local-path-provisioner
spec:
  group: deckhouse.io
  scope: Cluster
  names:
    plural: localpathprovisioners
    singular: localpathprovisioner
    kind: LocalPathProvisioner
  preserveUnknownFields: false
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        description: |
          StorageClass for volumes in a directory on the local disks of the cluster nodes.

          The module creates a StorageClass with the name of this object.
        properties:
          spec:
            type: object
            required:
            - path
            properties:
              nodeGroups:
                type: array
                items:
                  type: string
                description: |
                  Node groups whose nodes can hold the volumes of the StorageClass.

                  If not set, the StorageClass does not restrict the nodes.
                x-doc-examples:
                - - master
                  - worker
              path:
                type: string
                pattern: '^/[^"\\\s\p{Cc}]*$'
                description: |
                  Directory on the nodes where the volumes are created.

                  An absolute path without quotes, backslashes, whitespace and control characters.
                x-doc-examples: ["/opt/local-path-provisioner"]
              reclaimPolicy:
                type: string
                enum: ["Retain", "Delete"]
                default: "Retain"
                description: |
                  What happens to a PersistentVolume and its directory after the PersistentVolumeClaim is deleted.

                  - `Retain`: The PersistentVolume stays `Released`, and the data stays in the directory.
                  - `Delete`: The module removes the directory with the data and the PersistentVolume.

                  A change of the value recreates the StorageClass; existing PersistentVolumes keep the policy they were created with.
