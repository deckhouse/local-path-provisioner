name: local-path-provisioner
stage: General Availability
subsystems:
  - storage
namespace: d8-local-path-provisioner
descriptions:
  en: Provides local storage on Kubernetes nodes using HostPath volumes. Creates StorageClass resources for managing local storage provisioning.
  ru: Предоставляет локальное хранилище на узлах Kubernetes с использованием томов HostPath. Создает ресурсы StorageClass для управления выделением локального хранилища.
requirements:
  deckhouse: ">= 1.78"
accessibility:
  editions:
    _default:
      available: true
      enabledInBundles:
        - Default
        - Managed
