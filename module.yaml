name: local-path-provisioner
stage: General Availability
subsystems:
  - storage
namespace: d8-local-path-provisioner
descriptions:
  en: Provides volumes in directories on the local disks of the cluster nodes and creates a StorageClass for each LocalPathProvisioner.
  ru: Предоставляет тома в директориях на локальных дисках узлов кластера и создаёт StorageClass для каждого объекта LocalPathProvisioner.
requirements:
  deckhouse: ">= 1.78"
accessibility:
  editions:
    _default:
      available: true
      enabledInBundles:
        - Default
        - Managed
