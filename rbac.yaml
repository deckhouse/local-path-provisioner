# The module RBAC declaration, read from the RBAC objects the module renders. Review it: every TODO is a
# decision "dmt lint" reports; then run "dmt lint --linter rbac --fix" to bring the templates in line with it.
# Objects rendered only under values other than the defaults are not here: lint with --values-file (or
# --matrix) before the first --fix of the templates if the module has such templates, and declare them with when.
apiVersion: rbac.deckhouse.io/v1alpha1
resources:
  - group: deckhouse.io
    resource: localpathprovisioners
    system:
      manager:
        - create
        - delete
        - deletecollection
        - patch
        - update
      viewer:
        - get
        - list
        - watch
    legacy:
      ClusterAdmin:
        - create
        - delete
        - deletecollection
        - patch
        - update
      User:
        - get
        - list
        - watch
serviceAccounts:
  - name: local-path-provisioner
    labels:
      app: local-path-provisioner
    namespaceRules:
      - apiGroups:
          - ""
        resources:
          - pods
        verbs:
          - get
          - list
          - watch
          - create
          - patch
          - update
          - delete
    extraClusterRoles:
      - name: d8:local-path-provisioner
        rules:
          - apiGroups:
              - ""
            resources:
              - nodes
              - persistentvolumeclaims
              - configmaps
              - pods
              - pods/log
            verbs:
              - get
              - list
              - watch
          - apiGroups:
              - ""
            resources:
              - persistentvolumes
            verbs:
              - get
              - list
              - watch
              - create
              - patch
              - update
              - delete
          - apiGroups:
              - ""
            resources:
              - events
            verbs:
              - create
              - patch
          - apiGroups:
              - storage.k8s.io
            resources:
              - storageclasses
            verbs:
              - get
              - list
              - watch
access:
  - name: admin-kubeconfig
    subjects:
      - kind: Group
        name: kubeadm:cluster-admins
    clusterRules:
      - apiGroups:
          - deckhouse.io
        resources:
          - localpathprovisioners
        verbs:
          - get
          - list
          - watch
          - create
          - delete
          - deletecollection
          - patch
          - update
