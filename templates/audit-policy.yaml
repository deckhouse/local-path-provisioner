---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-service-accounts
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "local-path-provisioner" "control-plane-manager.deckhouse.io/extra-audit-policy-config" "")) | nindent 2 }}
data:
  basicAuditPolicy: |
    serviceAccounts:
    - "system:serviceaccount:d8-{{ .Chart.Name }}:{{ .Chart.Name }}"
