summary: "Первый выпуск local-path-provisioner в виде внешнего модуля: модуль выходит из ядра Deckhouse и поставляется из источника модулей deckhouse с теми же ресурсами и настройками."

highlights:
  - "Модуль поставляется из источника модулей deckhouse и выпускается независимо от Deckhouse. В Deckhouse 1.79 встроенная копия модуля удалена, и кластер, где она работает, при обновлении переходит на этот модуль."
  - "Ресурс LocalPathProvisioner, настройки модуля, StorageClass и PersistentVolume остаются без изменений."

upgrade_notes:
  - "Переход со встроенного модуля не требует ручных действий. Модулю нужен Deckhouse 1.78 или новее: на 1.78 выпуск скачивается заранее, а встроенная копия продолжает работать."
  - "При переходе со встроенной копии поды модуля один раз перезапускаются, потому что меняются образ и Secret для загрузки образов. Пока новые поды не станут Ready, тома не создаются и не удаляются."
