date: "2026-11-17"

summary: "Первый выпуск local-path-provisioner в виде внешнего модуля: модуль выходит из ядра Deckhouse Platform и поставляется из источника модулей `deckhouse` с теми же ресурсами и настройками."

highlights:
  - "Модуль поставляется из источника модулей `deckhouse` и выпускается независимо от Deckhouse Platform. В Deckhouse Platform 1.79 встроенная копия модуля удалена, и кластер, где она работает, при обновлении переходит на этот модуль."
  - "Объекты LocalPathProvisioner, настройки модуля, StorageClass и PersistentVolume сохраняются."

improvements:
  - "На StorageClass модуля стоит лейбл `storage.deckhouse.io/managed-by: local-path-provisioner`, как на StorageClass других модулей хранения, поэтому `ClusterResourceGrantPolicy` может выбрать их через `allowedSelector` или `deniedSelector`. Лейбл добавляется на существующие StorageClass на месте."

security:
  - "Провижинер модуля собран с golang.org/x/net v0.62.0, в которой исправлены CVE-2026-78661 и CVE-2026-97045 в golang.org/x/net/html."

upgrade_notes:
  - "Переход со встроенного модуля не требует ручных действий. Модулю нужен Deckhouse Platform 1.78 или новее: на 1.78 выпуск скачивается заранее, а встроенная копия продолжает работать."
  - "При переходе со встроенной копии поды модуля один раз перезапускаются, потому что меняются образ и Secret для загрузки образов. Пока новые поды не станут Ready, тома не создаются и не удаляются."

docs:
  - "В FAQ описано, что происходит с модулем при обновлении на Deckhouse Platform 1.79."
